baseURL = "https://www.mtotaro.com/"
defaultContentLanguage = "en"
title = "Matteo Totaro"
theme = "LoveIt"
#themesDir = "../.."

# whether to use robots.txt
enableRobotsTXT = true
# whether to use git commit log
enableGitInfo = false
# whether to use emoji code
enableEmoji = true

[languages]
  [languages.en]  ##to add another language in the main menù i need to repeat this language.it menu.starter
    weight = 1
    # language code
    languageCode = "en"
    # website title
    title = "Matteo Totaro"
    # language name
    languageName = "English"
    # whether to include Chinese/Japanese/Korean
    hasCJKLanguage = false
    # default amount of posts in each pages
    pagination.pagerSize = 24
    # copyright description used only for seo schema
    copyright = "This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License."

    # Menu Info
    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "posts"
        # you can add extra information before the name (HTML format is allowed), such as icons
        pre = ""
        # you can add extra information after the name (HTML format is supported), such as icons
        post = ""
        name = "📷 Gallery"
        url = "/posts/"
        # title will be shown when you hover on this menu link.
        title = "Digital pics"
        weight = 2
       

      [[languages.en.menu.main]]
        identifier = "projects"
        pre = ""
        post = ""
        name = "💻 Projects"
        url = "/projects/"
        title = "Uni, Hobbies and Stuff"
        weight = 3


      [[languages.en.menu.main]]
        identifier = "analogs"
        pre = ""
        post = ""
        name = "🎞️ Analog Wall"
        url = "/analogs/"
        title = "Analog"
        weight = 1         


      [[languages.en.menu.main]]
        identifier = "about"
        pre = ""
        post = ""
        name = "About"
        url = "/about/"
        title = "Who am I"
        weight = 4
      

      [languages.en.params]
        # site description
        description = "Personal space on the web with a gallery of shots presented in a very minimal way"
        # site keywords
        keywords = ["Matteo Totaro","Matteo","Totaro","Matteo Totaro website","mtotaro","Engineering","Electronic Engineer","Reggio Emilia","Università degli studi di Modena e Reggio Emilia","Hugo","Photography","Reflex","Photo","Engineering","Blog","Personal Blog","Photo Gallery","Museum","Travels","Barcelona","Venice","Italy","Amsterdam"]        
      # App icon config
      [languages.en.params.app]
        # optional site title override for the app when added to an iOS home screen or Android launcher
        title = "Matteo Totaro"
        # whether to omit favicon resource links
        noFavicon = false
        # modern SVG favicon to use in place of older style .png and .ico files
        svgFavicon = ""
        # Android browser theme color
        themeColor = "#ffffff"
        # Safari mask icon color
        iconColor = "#5bbad5"
        # Windows v8-10 tile color
        tileColor = "#da532c"
        # Home Page Info
        [languages.en.params.home]
        # amount of RSS pages
        rss = 10
        # Home page profile
          [languages.en.params.home.profile]
            enable = true
            # Gravatar Email for preferred avatar in home page
            gravatarEmail = ""  #putting the email kills the imageavatar
            # URL of avatar shown in home page
            avatarURL = "/images/avatar.jpg"
            # title shown in home page (HTML format is supported)
            title = "Matteo Totaro"
            # subtitle shown in home page
            subtitle = "Welcome to my space on the web"
            # whether to use typeit animation for subtitle
            typeit = true
            # whether to show social links
            social = true
            # disclaimer (HTML format is supported)
            disclaimer = ""
          # Home Page Posts
          [languages.en.params.home.posts] #if enabled it shows list of posts on the home page
                                            #controllare se possibile far vedere solo le immagini
            enable = false
            # special amount of posts in each home posts page
            pagination.pagerSize = 5
        # Social config in home page
        [languages.en.params.social]
          GitHub = "matteototaro"
          #Twitter = ""
          Instagram = "matt.totaro"
          Email = "tmatteos@gmail.com"
          Linkedin = "m-totaro"
          # Spotify = "xxxx"

[params]
  # LoveIt theme version
    version = "0.2.X"
    # site default theme ("light", "dark", "auto")
    defaultTheme = "light"
  # public git repo url only then enableGitInfo is true
    gitRepo = "https://github.com/dillonzq/LoveIt"
  # which hash function used for SRI, when empty, no SRI is used ("sha256", "sha384", "sha512", "md5")
    fingerprint = ""
  # date format
    dateFormat = "02/01/2006"
  # website images for Open Graph and Twitter Cards
    images = ["/images/cover.jpg"]

  # Header info
  [params.header]
    # desktop header mode ("fixed", "normal", "auto")
    desktopMode = "auto"
    # mobile header mode ("fixed", "normal", "auto")
    mobileMode = "auto"
    [params.header.title]
      # URL of the LOGO
      logo = ""#/static/LogoMT_127_40.png"
      # title name
      name = "MT"
      # you can add extra information before the name (HTML format is supported), such as icons
      pre = ""
      # you can add extra information after the name (HTML format is supported), such as icons
      post = ""
      # whether to use typeit animation for title name
      typeit = true

  # Footer Copyright Info
  [params.footer]
    enable = true
    # Custom content (HTML format is supported)
    custom = ''
    # whether to show Hugo and theme info
    hugo = false
    # whether to show copyright info
    copyright = true
    # whether to show the author
    author = false
    # site creation time
    since = 2020
    # ICP info only in China (HTML format is allowed)
    icp = ""
    # license info (HTML format is allowed)
    license= ''

  
  [params.section]
    # special amount of posts in each section page
    pagination.pagerSize = 20
    # date format (month and day)
    dateFormat = "02/01"
    # amount of RSS pages
    rss = 10

  # List (category or tag) page config
  [params.list]
    # special amount of posts in each list page
    pagination.pagerSize = 20
    # date format (month and day)
    dateFormat = "02/01/2006"
    # amount of RSS pages
    rss = 10


# Page config
  [params.page]
    # whether to hide a page from home page
    hiddenFromHomePage = false
    # whether to hide a page from search results
    hiddenFromSearch = false
    # whether to enable twemoji
    twemoji = false
    # whether to enable lightgallery
    lightgallery = true
    # whether to enable the ruby extended syntax
    ruby = false
    # whether to enable the fraction extended syntax
    fraction = false
    # whether to enable the fontawesome extended syntax
    fontawesome = false
    # whether to show link to Raw Markdown content of the content
    linkToMarkdown = false
    # whether to show the full text content in RSS
    rssFullText = true
    # Table of the contents config

    [params.page.toc]
      # whether to enable the table of the contents
      enable = true
      # whether to make the table of the contents automatically collapsed
      auto = true

    # Code config
    [params.page.code]
      # whether to show the copy button of the code block
      copy = true
      # the maximum number of lines of displayed code by default
      maxShownLines = 10
   
    # KaTeX mathematical formulas config (KaTeX https://katex.org/)
    [params.page.math]
      enable = true
      # default block delimiter is $$ ... $$ and \\[ ... \\]
      blockLeftDelimiter = ""
      blockRightDelimiter = ""
      # default inline delimiter is $ ... $ and \\( ... \\)
      inlineLeftDelimiter = ""
      inlineRightDelimiter = ""
      # KaTeX extension copy_tex
      copyTex = true
      # KaTeX extension mhchem
      mhchem = true
    # Social share buttons: off (no third-party share scripts)
    [params.page.share]
      enable = false

    # Comments are disabled (no third-party scripts)
    [params.page.comment]
      enable = false

    # SEO config
    [params.page.seo]
      # image URL
      images = []
      # Publisher info
      [params.page.seo.publisher]
        name = "Matteo Totaro"
        logoUrl = "avatar.jpg"

  # TypeIt config
  [params.typeit]
    # typing speed between each step (measured in milliseconds)
    speed = 100
    # blinking speed of the cursor (measured in milliseconds)
    cursorSpeed = 1000
    # character used for the cursor (HTML format is supported)
    cursorChar = "|"
    # cursor duration after typing finishing (measured in milliseconds, "-1" means unlimited)
    duration = -1

  # site verification code for Google/Bing/Yandex/Pinterest/Baidu
  [params.verification]
    google = ""
    bing = ""
    yandex = ""
    pinterest = ""
    baidu = ""

  # Site SEO config
  [params.seo]
    # image URL
    image = "/images/cover.jpg"
    # thumbnail URL
    thumbnailUrl = "logoMT.png"

 # No analytics, no cookies
  [params.analytics]
    enable = false

  [params.cookieconsent]
    enable = false

   [services]
   #If simple mode is enabled, a static and no-JS version of the Instagram image card will be built. 
   #Note that this only supports image cards and the image itself will be fetched from Instagram’s servers.
      [services.instagram]
          disableInlineCSS = false

  # CDN config for third-party library files
  
  [params.cdn]
    # CDN data file name, disabled by default
    # ("jsdelivr.yml")
    # located in "themes/LoveIt/assets/data/cdn/" directory
    # you can store your own data files in the same path under your project:
    # "assets/data/cdn/"
    # empty = serve the theme libraries from this site (no jsdelivr, no third party)
    data = ""

  # Compatibility config
  [params.compatibility]
    # whether to use Polyfill.io to be compatible with older browsers
    polyfill = false
    # whether to use object-fit-images to be compatible with older browsers
    objectFit = true

# Markup related configuration in Hugo
[markup]
  # Syntax Highlighting (https://gohugo.io/content-management/syntax-highlighting)
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    # false is a necessary configuration (https://github.com/dillonzq/LoveIt/issues/158)
    noClasses = false
  # Goldmark is from Hugo 0.60 the default library used for Markdown
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      # whether to use HTML tags directly in the document
      unsafe = true
  # Table Of Contents settings
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

[author]
  name = "Matteo Totaro"
  email = "tmatteos@gmail.com"
  link = "/about/"
  
# Sitemap Info
[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

# Permalinks Info (https://gohugo.io/content-management/urls/#permalinks)
[Permalinks]
  # posts = ":year/:month/:filename"
  posts = ":contentbasename"

# Privacy Info (https://gohugo.io/about/hugo-and-gdpr/)
[privacy]
  # privacy of the Google Analytics (replaced by params.analytics.google)
  [privacy.googleAnalytics]
    # ...
  [privacy.x]
    enableDNT = true
  [privacy.youtube]
    privacyEnhanced = true

# Options to make output .md files
[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["md"]

# Options to make output .md files
[outputFormats.MarkDown]
  mediaType = "text/plain"
  isPlainText = true
  isHTML = false

# Options to make hugo output files???
[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML", "MarkDown"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]