[build]
publish = "public"
command = "hugo --gc --minify -b $URL"

[context.production.environment]
HUGO_VERSION = "0.147.8"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.147.8"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.147.8"

# AMP pages are no longer generated: send old /amp/ links to the normal page.
[[redirects]]
  from = "/amp/*"
  to = "/:splat"
  status = 301

# Security headers for every response.
# The CSP starts as Report-Only: violations are only logged in the browser
# console. Once the deploy preview shows no violations, rename the key to
# "Content-Security-Policy" to enforce it.
# Origins in use (checked on the built site): cdn.jsdelivr.net (theme libs),
# res.cloudinary.com (photos), open.spotify.com and www.youtube-nocookie.com
# (embeds), storage.googleapis.com / tfhub.dev / www.kaggle.com (TF.js models
# on the objdetect project page).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://res.cloudinary.com; font-src 'self' data: https://cdn.jsdelivr.net; frame-src https://open.spotify.com https://www.youtube-nocookie.com; connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com https://tfhub.dev https://www.kaggle.com; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"

[[headers]]
  for = "index.xml"
  [headers.values]
    Content-Type = "application/rss+xml"
